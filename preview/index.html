<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>斗地主 · 全量 UI 预览</title>
<style>
:root{color-scheme:light;--jade:#164f43;--gold:#bb9555;--paper:#f8f4e8;--muted:#6b796e}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:#173f35;font:15px/1.6 "Microsoft YaHei",sans-serif}
header{padding:32px max(5vw,20px);background:#143e35;color:#f7f1dd;border-bottom:3px solid #ba965a}
h1{margin:0 0 7px;font-size:27px;letter-spacing:3px}header p{margin:4px 0;opacity:.88}.topline{display:flex;justify-content:space-between;gap:20px;align-items:center}
main{max-width:1700px;padding:26px;margin:auto}button,input,select{font:inherit}button{cursor:pointer}.pill{padding:8px 15px;border:1px solid #c8b27f;border-radius:22px;background:#fff9eb;color:var(--jade)}.pill[aria-pressed=true]{background:var(--jade);color:#fff8df}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:17px}input{min-width:250px;flex:1;padding:10px 15px;border:1px solid #b9c6b6;border-radius:8px;background:#fffdf8}
.meta{color:var(--muted);font-size:13px;margin:10px 0 22px}.stats{display:flex;gap:24px;margin:18px 0}.stats b{font-size:26px;font-weight:600}.bar{height:5px;background:#527269;max-width:600px;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#e0bc72}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(350px,1fr));gap:22px}.card{border:1px solid #d5c9ac;border-radius:13px;overflow:hidden;background:#fffdf6;box-shadow:0 5px 15px #25483609}.image-button{display:block;width:100%;padding:0;border:0;background:#eee8d6}.image-button img{display:block;width:100%;height:auto;aspect-ratio:2.37;object-fit:contain}.image-button.components img{aspect-ratio:1.5;background:repeating-conic-gradient(#eee8da 0 25%,#fff9ed 0 50%) 0/22px 22px}
.card-body{padding:15px 17px}.card h2{font-size:17px;margin:0 0 7px}.tag{float:right;font-size:12px;border:1px solid #b7c9ae;padding:2px 8px;border-radius:20px}.pending{padding:30px 20px;background:#f0ecdF;color:#7e806b}.id{font-size:12px;color:#7d826d}
.card p{font-size:13px;color:#647164;margin:5px 0}.links{display:flex;gap:14px;margin-top:10px}a{color:#166653;text-underline-offset:3px}.empty{padding:50px;text-align:center}
dialog{width:min(1600px,96vw);max-height:96vh;border:1px solid #b39962;border-radius:12px;padding:0;background:#f9f5e9;color:#173f35}dialog::backdrop{background:#071d19d9}
.dialog-head{display:flex;gap:15px;align-items:center;justify-content:space-between;padding:15px 22px;border-bottom:1px solid #d5c9ac}.dialog-head h2{font-size:18px;margin:0}.viewer{background:#e9e2cf;text-align:center;overflow:auto}.viewer img{max-width:100%;height:auto;vertical-align:middle}.details{padding:18px 22px}.states{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}.state{border:1px solid #d8ccb0;border-radius:7px;padding:12px;font-size:13px}.state b{display:block}.small{font-size:12px;color:#78826d}.warn{color:#8b5d30}.tools{display:flex;gap:8px}.notice{border-left:3px solid #bc9b5a;padding:9px 15px;background:#eee7d5;margin-bottom:20px}footer{padding:30px;text-align:center;color:#7a806c;font-size:12px}
@media(max-width:600px){main{padding:14px}.grid{grid-template-columns:1fr}.topline{display:block}.stats{gap:15px}.stats b{font-size:22px}}
</style></head><body>
<header><div class="topline"><div><h1>斗地主 · 全量 UI</h1><p>道家 Q 版高清手绘 · 玉绿 / 米白 / 暖金</p></div><button class="pill" onclick="location.reload()">刷新进度</button></div><div class="stats"><span><b id="generated">0</b> 已生成</span><span><b id="ready">0</b> 可评审</span><span><b id="total">60</b> 项清单</span></div><div class="bar"><i id="bar"></i></div></header>
<main><div class="notice">完整页面独立查看；公共控件与牌面为专项图板。图内数值均为设计示意，页面状态和实际原生尺寸可在详情查看。<a href="../assets/ui/manifest.json">94 个通用素材来源</a> · <a href="../assets/ui/deck-review.jpg" target="_blank">54 张牌预览</a></div>
<div class="filters"><input id="search" type="search" placeholder="搜索页面、控件、状态…" aria-label="搜索页面"><button class="pill" data-batch="all" aria-pressed="true">全部</button><button class="pill" data-batch="core">大厅房间</button><button class="pill" data-batch="table">牌局结算</button><button class="pill" data-batch="modes">模式装扮</button><button class="pill" data-batch="support">日常系统</button><button class="pill" data-batch="components">通用素材</button><button class="pill" id="onlyReady" aria-pressed="false">只看已生成</button></div>
<div class="meta" id="meta"></div><section class="grid" id="grid" aria-live="polite"></section></main>
<dialog id="detail"><div class="dialog-head"><h2 id="dtitle"></h2><div class="tools"><button class="pill" id="prev" aria-label="上一页">←</button><button class="pill" id="next" aria-label="下一页">→</button><button class="pill" id="close">关闭</button></div></div><div class="viewer"><img id="dimage" alt=""></div><div class="details"><p id="dmeta"></p><p id="dcontrols"></p><div class="links" id="dlinks"></div><h3>状态覆盖</h3><div class="states" id="dstates"></div><p class="small">rendered＝原画可见；shared_component＝复用公共皮肤与原生动态文字；specified_only＝仅规范待细化。此状态不会被算作另一张新生图。</p><div id="dqa"></div></div></dialog>
<footer>文件均保存在本项目 · 设计稿待用户确认 · 模型与质量以各图 generation.json 的真实证据为准</footer>
<script src="catalog.js"></script><script>
const C=window.UI_CATALOG,$=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let batch='all',only=false,current=null,visible=[];
const url=p=>'../'+p.split('/').map(encodeURIComponent).join('/');
$('#generated').textContent=C.generated;$('#ready').textContent=C.readyForUserReview;$('#total').textContent=C.total;$('#bar').style.width=(100*C.generated/C.total)+'%';
function render(){const q=$('#search').value.trim().toLowerCase();visible=C.pages.filter(p=>(batch==='all'||p.batch===batch)&&(!only||p.exists)&&(!q||p.searchText.toLowerCase().includes(q)));
$('#meta').textContent='显示 '+visible.length+' 项 · 最近核验 '+new Date(C.updatedAt).toLocaleString('zh-CN')+' · 可评审仍需用户确认';
$('#grid').innerHTML=visible.map(p=>'<article class="card">'+(p.exists?'<button class="image-button '+e(p.batch)+'" data-open="'+e(p.id)+'" aria-label="查看'+e(p.title)+'"><img loading="lazy" src="'+url(p.output)+'" alt="'+e(p.title)+'"></button>':'<div class="pending">待制作 · '+e(p.title)+'</div>')+'<div class="card-body"><span class="tag">'+(p.status==='design_ready_user_review'?'可评审':p.exists?'待核验':'待制作')+'</span><div class="id">'+e(p.id)+'</div><h2>'+e(p.title)+'</h2><p>'+e(p.controls.join(' · '))+'</p><p>'+(p.exists?e(p.width+' × '+p.height+' 原生像素'):'独立完整页面列入制作清单')+'</p>'+(p.exists?'<div class="links"><a href="'+url(p.output)+'" target="_blank">原图</a><a href="'+url(p.generation)+'" target="_blank">生成记录</a><button class="pill" data-open="'+e(p.id)+'">状态与检查</button></div>':'')+'</div></article>').join('')||'<div class="empty">没有匹配页面</div>';}
function open(id){current=C.pages.find(p=>p.id===id);if(!current||!current.exists)return;const p=current;$('#dtitle').textContent=p.id+' · '+p.title;$('#dimage').src=url(p.output);$('#dimage').alt=p.title;$('#dmeta').textContent=p.width+' × '+p.height+' 原生像素 · '+p.pixelMode+' · 待用户确认';$('#dcontrols').textContent='控件：'+p.controls.join('、');$('#dlinks').innerHTML='<a target="_blank" href="'+url(p.output)+'">打开原图</a><a target="_blank" href="'+url(p.generation)+'">生成证据</a><a target="_blank" href="'+url(p.stateSpec)+'">完整状态规范</a><a target="_blank" href="states.html?id='+encodeURIComponent(p.id)+'">公共状态演示</a>';$('#dstates').innerHTML=(p.stateDetails||[]).map(s=>'<div class="state"><b>'+e(s.name||s.state)+' <span class="small">'+e(s.coverage)+'</span></b>'+e(s.interaction||s.behavior||s.description||'状态定义见完整规范')+'</div>').join('');$('#dqa').innerHTML='<h3>检查记录</h3><pre style="white-space:pre-wrap;font:inherit;font-size:13px">'+e(JSON.stringify(p.review,null,2))+'</pre>';if(!$('#detail').open)$('#detail').showModal();}
$('#grid').onclick=ev=>{const b=ev.target.closest('[data-open]');if(b)open(b.dataset.open);};$('#search').oninput=render;document.querySelectorAll('[data-batch]').forEach(b=>b.onclick=()=>{batch=b.dataset.batch;document.querySelectorAll('[data-batch]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render();});$('#onlyReady').onclick=()=>{only=!only;$('#onlyReady').setAttribute('aria-pressed',String(only));render();};$('#close').onclick=()=>$('#detail').close();
function move(d){const list=visible.filter(p=>p.exists),i=list.findIndex(p=>p.id===current?.id);if(list.length)open(list[(i+d+list.length)%list.length].id);}$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);document.onkeydown=ev=>{if($('#detail').open&&ev.key==='ArrowLeft')move(-1);if($('#detail').open&&ev.key==='ArrowRight')move(1);};render();
</script></body></html>
