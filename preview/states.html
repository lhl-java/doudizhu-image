<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>斗地主 · 状态设计演示</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5efdf;color:#204b3c;font:16px/1.6 "Microsoft YaHei",sans-serif}header{padding:18px 30px;background:#183f35;color:#fff9df}header a{color:#f7ddaa}h1{font-size:20px;margin:4px 0}main{max-width:1500px;margin:auto;padding:24px}.selectors{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}select,button{font:inherit}select{padding:8px;border:1px solid #c9b57f;background:#fffaf0;color:#204b3c;border-radius:8px;max-width:100%}.stage{position:relative;aspect-ratio:2.37;border:1px solid #bba271;border-radius:12px;overflow:hidden;background:#e3ddc9}.base{display:block;width:100%;height:100%;object-fit:contain}.veil{position:absolute;inset:0;background:#122e2769;display:flex;align-items:center;justify-content:center;padding:20px}.panel{position:relative;width:min(570px,80%);padding:38px 42px 30px;background:transparent;border:45px solid transparent;border-image:url('../assets/ui/controls/panel.png') 60 fill stretch;color:#173f35;text-align:center;filter:drop-shadow(0 10px 20px #09251f50)}.panel h2{font-size:24px;margin:-15px 0 14px}.panel p{font-size:16px;line-height:1.7;margin:10px -10px;white-space:pre-line}.actions{display:flex;gap:12px;justify-content:center;margin:19px -18px -10px}.game-button{position:relative;min-width:140px;height:55px;border:0;background:url('../assets/ui/controls/primary-normal.png') center/100% 100% no-repeat;color:#fff8de;text-shadow:0 1px #153f30;cursor:pointer;font-weight:600;padding:12px 25px}.game-button.secondary{background-image:url('../assets/ui/controls/secondary-normal.png');color:#254936;text-shadow:none}.game-button:active{background-image:url('../assets/ui/controls/primary-pressed.png')}.game-button:disabled{background-image:url('../assets/ui/controls/primary-disabled.png');color:#d6dfcd;cursor:default}.statusnote{position:absolute;top:14px;left:15px;background:#fff8dfec;padding:5px 12px;border-radius:20px;color:#255340;font-size:12px}.details{background:#fffaf0;padding:20px;border:1px solid #d5c6a4;border-radius:10px;margin-top:18px}.details h3{margin:0 0 8px}code{white-space:pre-wrap}.caption{font-size:13px;color:#6f7a66;margin:10px 0}.feedback{min-height:26px;color:#86632e;font-size:13px}.progress{height:14px;border-radius:10px;background:#ded9c7;overflow:hidden;margin:17px 0}.progress i{display:block;width:55%;height:100%;background:#2c7c5a}.hidden{display:none!important}@media(max-width:650px){main{padding:10px}.stage{aspect-ratio:1.3}.panel{width:90%;padding:18px 20px;border-width:30px}.panel h2{font-size:20px}.panel p{font-size:13px}.game-button{min-width:90px;height:43px;padding:8px 12px}.actions{gap:6px}}
</style></head><body><header><a href="index.html">← 全量 UI 目录</a><h1>状态设计演示</h1><div>生成的同源皮肤 + 原生文字排版 · 本地交互示意</div></header><main><div class="selectors"><select id="page" aria-label="选择页面"></select><select id="state" aria-label="选择状态"></select><button id="reset">显示原画</button></div><div class="stage"><img class="base" id="base" alt=""><div class="statusnote" id="statusnote"></div><div class="veil" id="veil"><section class="panel"><h2 id="title"></h2><p id="copy"></p><div id="loading" class="progress hidden"><i></i></div><div class="actions" id="actions"></div></section></div></div><div class="caption" id="caption"></div><div class="feedback" id="feedback" role="status"></div><section class="details"><h3>本状态行为</h3><p id="behavior"></p><div id="reasons"></div><p class="caption">此演示用于呈现公共状态皮肤、文字与按钮语义。主界面为单独设计原画；未把原生文字演示记为新的 AI 生图，也未连接账号、支付、服务器或聊天服务。</p></section></main><script src="catalog.js"></script><script>
const C=window.UI_CATALOG,$=s=>document.querySelector(s),name=s=>s.name||s.state,text=v=>Array.isArray(v)?v.join('\n'):v||'',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let pages=C.pages.filter(p=>p.exists),current;
$('#page').innerHTML=pages.map(p=>'<option value="'+p.id+'">'+p.id+' '+esc(p.title)+'</option>').join('');let initial=new URLSearchParams(location.search).get('id');if(pages.some(p=>p.id===initial))$('#page').value=initial;
function page(){current=pages.find(p=>p.id===$('#page').value);$('#base').src='../'+current.output;$('#base').alt=current.title;$('#state').innerHTML=current.stateDetails.map((s,i)=>'<option value="'+i+'">'+esc(name(s))+' · '+esc(s.coverage)+'</option>').join('');state();}
function labels(s){if(s.buttons?.length)return s.buttons;const n=name(s);if(/失败|异常|断|错误|超时/.test(n))return ['返回','重试'];if(/不足|未达|锁|未拥有|未解锁/.test(n))return ['返回','查看条件'];if(/确认|解散|退出|切换/.test(n))return ['取消','确定'];if(/可领|可签|可兑|成功|奖励/.test(n))return ['确定'];if(/加载|处理中|连接中|进行中/.test(n))return ['取消'];return ['返回','确定'];}
function state(){const s=current.stateDetails[Number($('#state').value)]||{name:'正常',coverage:'rendered'};$('#feedback').textContent='';const n=name(s);$('#title').textContent=s.title||n;$('#copy').textContent=text(s.actualCopy)||text(s.copy)||text(s.description)||(s.coverage==='rendered'?'当前状态已体现在主原画。':n+'状态的同源公共皮肤与原生文案示意。');$('#behavior').textContent=text(s.behavior)||text(s.interaction)||'界面按当前状态显示对应控件与安全返回入口。';$('#reasons').textContent=s.disabledReasons?.length?'不可操作原因：'+text(s.disabledReasons):'';$('#statusnote').textContent=current.title+' / '+n;$('#caption').textContent=s.coverage==='rendered'?'主状态原画；点击“显示原画”可隐藏演示层。':s.coverage==='shared_component'?'复用已生成透明组件的状态设计；非另一张独立生成图。':'本状态原规范仅作说明；当前演示补充公共皮肤呈现，业务细节按规范执行。';$('#veil').classList.remove('hidden');$('#loading').classList.toggle('hidden',!/加载|处理中|连接中/.test(n));$('#actions').innerHTML=labels(s).map((t,i)=>'<button class="game-button '+(labels(s).length>1&&/^(取消|返回|稍后|关闭|不|拒绝)/.test(t)?'secondary':'')+'">'+esc(t)+'</button>').join('');}
$('#page').onchange=page;$('#state').onchange=state;$('#reset').onclick=()=>{$('#veil').classList.toggle('hidden');};$('#actions').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;$('#feedback').textContent='已演示“'+b.textContent+'”操作。此处仅为本地设计交互，不发送请求。';if(/返回|取消|确定|领取/.test(b.textContent))$('#veil').classList.add('hidden');};page();
</script><script>
const renderStateBase=state;
state=function(){renderStateBase();const s=current.stateDetails[Number($('#state').value)];$('#veil').classList.toggle('hidden',s?.coverage==='rendered');};
$('#state').onchange=state;
$('#reset').onclick=()=>$('#veil').classList.add('hidden');
state();
</script></body></html>
